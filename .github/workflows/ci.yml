name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        sourcemod-version: [1.12-dev, master]
        include:
          - target-archs: x86,x86_64

    steps:
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -yq --no-install-recommends clang g++-multilib libstdc++6 lib32stdc++6

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.13

      - name: Setup AMBuild
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/alliedmodders/ambuild

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          path: extension

      - name: Fetch SourceMod ${{ matrix.sourcemod-version }}
        uses: actions/checkout@v7.0.1
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sourcemod-version }}
          path: sourcemod
          submodules: recursive

      - name: Build
        working-directory: extension
        shell: bash
        run: |
          mkdir build && cd build
          perl ../curl/lib/mk-ca-bundle.pl
          python ../configure.py --enable-optimize --targets=${{ matrix.target-archs }}
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ runner.os }}-${{ matrix.sourcemod-version }}
          path: extension/build/package


  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          7z a sm-ripext-${version}-linux.zip ./Linux/*
          7z a sm-ripext-${version}-windows.zip ./Windows/*

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          file: '*.zip'
          file_glob: true
